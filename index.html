<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ดาวน์โหลดไฟล์รายวิชา</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{ --paper:#eef2f5; --surface:#fff; --ink:#13212e; --muted:#5a6b7a; --line:#c9d3dc;
         --accent:#1d4e89; --ok:#0e7a5a; --ok-soft:#dcf1e8; --warn:#b8730a; --warn-soft:#fbeed3;
         --err:#b42318; --err-soft:#fbe1de; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"IBM Plex Sans Thai",Tahoma,sans-serif;background:var(--paper);color:var(--ink);
       font-size:17px;line-height:1.55;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  main{max-width:440px;margin:0 auto;padding:28px 20px 40px}
  h1{font-size:24px;line-height:1.3;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 20px}
  .box{padding:16px 18px;border-radius:8px;border-left:6px solid;margin-bottom:18px}
  .box b{display:block;font-size:19px}
  .box.ok{background:var(--ok-soft);border-color:var(--ok)}
  .box.warn{background:var(--warn-soft);border-color:var(--warn)}
  .box.err{background:var(--err-soft);border-color:var(--err)}
  .box.wait{background:var(--surface);border-color:var(--accent)}
  .img-wrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center}
  .img-wrap img{max-width:100%;height:auto;display:block;margin:0 auto}
  .hint{color:var(--muted);font-size:15px;margin-top:8px;text-align:center}
  .btn{display:block;width:100%;margin-top:14px;font:inherit;font-weight:700;font-size:18px;padding:14px;border:0;
       border-radius:8px;background:var(--accent);color:#fff;text-align:center;text-decoration:none;cursor:pointer}
  .btn.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .hidden{display:none!important}
</style>
</head>
<body>
<main>
  <h1>ดาวน์โหลดไฟล์ประจำตัวนักศึกษา</h1>
  <p class="sub" id="hello">กำลังเชื่อมต่อกับ LINE…</p>

  <div id="status" class="box wait"><b id="sTitle">กำลังตรวจสอบการลงทะเบียน…</b><span id="sText"></span></div>

  <div id="filePanel" class="hidden">
    <div class="img-wrap"><img id="img" alt="ไฟล์ของนักศึกษา"></div>
    <div class="hint">ถ้าปุ่มบันทึกใช้ไม่ได้ ให้กดค้างที่รูปแล้วเลือก "บันทึกรูปภาพ"</div>
    <button id="saveBtn" class="btn" type="button">บันทึกรูปลงเครื่อง</button>
  </div>

  <a id="registerBtn" class="btn hidden">ลงทะเบียน LINE รายวิชา</a>
  <button id="closeBtn" class="btn secondary hidden" type="button">ปิดหน้านี้</button>
</main>

<script>
  /* ===== ตั้งค่า: แก้ 3 บรรทัดนี้ ===== */
  const LIFF_ID      = '2012032680-Hso2gdVF';
  const GAS_URL      = 'https://script.google.com/macros/s/AKfycbzcC4IwKcmyMsWZiwJy3PvqQU6mv39ZIX_xABldl8G-nLh2CUsWZV5i0eWkPvscZ-zJ/exec';
  const REGISTER_URL = 'https://liff.line.me/2011989508-GtiF91k9';

  const $ = id => document.getElementById(id);
  let fileBlob = null, fileName = 'file.png';

  function status(kind, title, text){
    $('status').className = 'box ' + kind;
    $('sTitle').textContent = title; $('sText').textContent = text || '';
  }

  async function api(payload){
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ idToken: liff.getIDToken() }, payload)),
    });
    return res.json();
  }

  function b64ToBlob(b64, type){
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type });
  }

  // บันทึกรูป: ใช้เมนูแชร์ของมือถือถ้ามี ไม่งั้นดาวน์โหลดตรง
  $('saveBtn').addEventListener('click', async () => {
    if (!fileBlob) return;
    const file = new File([fileBlob], fileName, { type: fileBlob.type });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: fileName });
        return;
      }
    } catch (err) { if (err.name === 'AbortError') return; }
    const url = URL.createObjectURL(fileBlob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  });

  $('registerBtn').href = REGISTER_URL;
  $('closeBtn').addEventListener('click', () => liff.closeWindow());

  (async () => {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }

      const profile = await liff.getProfile().catch(() => null);
      if (profile) $('hello').textContent = 'สวัสดี ' + profile.displayName;

      const r = await api({ action: 'myFile' });

      if (r.status === 'found') {
        fileBlob = b64ToBlob(r.data, r.mimeType);
        fileName = r.fileName;
        $('img').src = URL.createObjectURL(fileBlob);
        status('ok', 'พบข้อมูลของคุณ', 'รหัสนักศึกษา ' + r.id);
        $('filePanel').classList.remove('hidden');
      } else if (r.status === 'not_registered') {
        status('warn', 'ยังไม่ได้ลงทะเบียน LINE ในรายวิชา',
               'กรุณากดปุ่มด้านล่างเพื่อลงทะเบียนด้วยรหัสนักศึกษา แล้วกลับมาเปิดลิงก์นี้อีกครั้ง');
        $('registerBtn').classList.remove('hidden');
      } else if (r.status === 'no_file') {
        status('warn', 'ยังไม่มีไฟล์ของคุณ', 'รหัสนักศึกษา ' + r.id + ' กรุณาติดต่ออาจารย์ประจำวิชา');
      } else {
        status('err', 'เกิดข้อผิดพลาด', r.message || 'กรุณาปิดหน้านี้แล้วเปิดลิงก์ใหม่');
      }
      if (liff.isInClient()) $('closeBtn').classList.remove('hidden');
    } catch (err) {
      status('err', 'เปิดหน้านี้ไม่สำเร็จ', 'กรุณาเปิดลิงก์จากแอป LINE อีกครั้ง (' + err.message + ')');
    }
  })();
</script>
</body>
</html>
